name: check

on:
  pull_request:
  push:
    branches: [main, release/homologation]

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + typecheck + testes + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # Necessario para comparar com a base do PR no passo de whitespace.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Mesma sequencia do "Pipeline obrigatorio" da Fase 17 do plano final:
      # lint, typecheck, test:pricing e build:webpack.
      - name: Validacao completa
        run: npm run check

      - name: Espacos em branco no diff
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
